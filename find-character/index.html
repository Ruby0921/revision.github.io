const root=document.getElementById('stars'), progress=[...document.querySelectorAll('.pstar')], hint=document.getElementById('hint'), message=document.getElementById('message'), game=document.querySelector('.game'), target=document.querySelector('.target');let found=0, roundIndex=0;
// 使用浏览器内建音源，不需要外部音效文件
let audioCtx;function tone(freq, start, duration, type='sine', volume=0.09){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+start);g.gain.setValueAtTime(0.0001,audioCtx.currentTime+start);g.gain.exponentialRampToValueAtTime(volume,audioCtx.currentTime+start+0.015);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+start+duration);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+start);o.stop(audioCtx.currentTime+start+duration+0.02)}catch(e){}}
function correctSound(){tone(660,0,.16,'sine',.10);tone(880,.12,.22,'sine',.09)}function wrongSound(){tone(230,0,.22,'triangle',.16);tone(185,.08,.18,'triangle',.10)}function winSound(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.32,'sine',.10))}
function build(){const round=rounds[roundIndex];root.innerHTML='';found=0;target.textContent=round.target;game.style.backgroundImage=round.background?`url(\"${round.background}\")`:'';const progressXs=roundIndex===1||roundIndex===3?['69.27%','74.61%','80.08%','85.81%','91.50%']:roundIndex===2||roundIndex===4?['67.38%','73.14%','78.91%','84.64%','90.75%']:['67.42%','73.18%','78.91%','84.70%','90.82%'];const progressY=roundIndex===1||roundIndex===3?'7.47%':roundIndex===2||roundIndex===4?'7.62%':'7.52%';const starWidth=roundIndex===1||roundIndex===3?'3.91%':'4.04%';const starHeight=roundIndex===1||roundIndex===3?'5.76%':'5.86%';progress.forEach((s,i)=>{s.style.setProperty('--x',progressXs[i]);s.style.top=progressY;s.style.width=starWidth;s.style.height=starHeight;s.classList.remove('on')});message.classList.remove('show');hint.classList.remove('show');document.querySelector('.message h2').textContent=['太棒了！🎉','第二题完成！🎉','第三题完成！🎉','第四题完成！🎉','第五题完成！🎉'][roundIndex];document.querySelector('.message p').textContent=`你找到了全部 5 个“${round.target}”！`;document.getElementById('again').textContent=roundIndex<rounds.length-1?'下一题':'再玩一次';round.items.forEach((it,i)=>{const b=document.createElement('button');b.className='star';b.style.left=it.x+'%';b.style.top=it.y+'%';b.textContent=it.t;b.setAttribute('aria-label','星星 '+(i+1)+'：'+it.t);b.addEventListener('click',()=>{if(b.classList.contains('found'))return;if(it.t===round.target){b.classList.add('found');found++;progress[found-1].classList.add('on');if(found===5){winSound();setTimeout(()=>message.classList.add('show'),350)}else{correctSound()}}else{wrongSound();b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),900)}});root.appendChild(b)})}
