<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff"><title>數學邏輯訓練站</title>
<style>
:root{--ink:#24334a;--blue:#4c87e8;--green:#43b581;--red:#e46b76;--line:#dce5f2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f1f7ff,#fff8e9);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}.app{max-width:1000px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.logo{width:50px;height:50px;border-radius:16px;background:#ffd76b;display:grid;place-items:center;font-size:29px}.brand h1{font-size:clamp(22px,5vw,32px);margin:0}.brand p{margin:4px 0;color:#60728c}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:white;border:1px solid var(--line);border-radius:99px;padding:8px 11px;font-weight:800}.progress{height:9px;background:#dce8f7;border-radius:99px;margin:15px 0;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#6e9df1,#66cba0);width:0}.layout{display:grid;grid-template-columns:230px 1fr;gap:14px}.side,.main{background:#ffffffed;border:2px solid white;border-radius:22px;box-shadow:0 8px 25px #36547b12}.side{padding:14px}.side h2{font-size:18px;margin:3px 0 12px}.stage{display:flex;flex-direction:column;gap:8px}.stage-btn{display:flex;align-items:center;gap:9px;text-align:left;background:#f4f7fc;border:2px solid transparent;border-radius:14px;padding:11px;color:var(--ink);font-weight:800}.stage-btn .emoji{font-size:24px}.stage-btn small{display:block;color:#718099;font-weight:500;margin-top:3px}.stage-btn.active{background:#eaf3ff;border-color:#8eb8ff}.stage-btn.done{background:#e8f8ef}.tip{margin-top:13px;padding:12px;border-radius:15px;background:#fff6d9;line-height:1.7;font-size:14px}.main{padding:clamp(14px,3vw,28px);min-height:520px}.eyebrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#6a7b94;font-weight:800}.tag{background:#f1edff;color:#6755c4;border-radius:99px;padding:7px 11px;font-size:13px}.question{font-size:clamp(25px,5vw,37px);line-height:1.5;text-align:center;margin:22px 0 7px;font-weight:900}.hintline{text-align:center;color:#63738b;font-size:15px;line-height:1.8;margin:0 0 16px}.visual{min-height:90px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.big{font-size:clamp(30px,7vw,55px);font-weight:950;color:#2f69bd;background:#eaf4ff;border-radius:18px;padding:10px 16px;text-align:center}.blocks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.block{padding:10px;border-radius:13px;background:#fff7df;border:2px solid #ffe3a0;text-align:center;min-width:64px}.block b{display:block;font-size:24px}.block span{font-size:13px;color:#7c6b4b}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:650px;margin:auto}.choice{min-height:60px;border:2px solid #dfe8f5;border-radius:16px;background:white;font-size:clamp(19px,4vw,27px);font-weight:900;color:var(--ink);box-shadow:0 3px 0 #e5ebf3;padding:10px 5px}.choice.selected{border-color:var(--blue);background:#eaf4ff}.choice.correct{border-color:var(--green);background:#e8f8ef}.choice.wrong{border-color:var(--red);background:#fff0f0}.feedback{display:none;margin:16px auto 0;max-width:650px;border-radius:15px;padding:13px;line-height:1.7;font-size:16px}.feedback.show{display:block}.good{background:#e8f8ef;border:1px solid #b6e8cb}.help{background:#fff6dc;border:1px solid #ffe39c}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{padding:13px 20px;border-radius:14px;font-weight:900;font-size:17px;min-height:48px}.primary{background:var(--blue);color:white;box-shadow:0 4px 0 #2e65bf}.primary:disabled{opacity:.45;box-shadow:none}.secondary{background:#eef2f8;color:#42516a}.hidden{display:none!important}.center{text-align:center;padding:24px 5px}.center h2{font-size:clamp(28px,6vw,40px)}.center p{line-height:1.9;color:#60728c;font-size:17px}.score{font-size:48px;font-weight:950;color:#3776d0;margin:12px}.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:540px;margin:18px auto}.resultcard{background:#f5f8fc;border-radius:14px;padding:12px 4px}.resultcard b{display:block;font-size:24px}.resultcard span{font-size:12px;color:#718099}.review{background:#fff8e7;border-radius:14px;padding:13px;text-align:left;line-height:1.8;max-width:600px;margin:16px auto}.foot{text-align:center;color:#8190a4;font-size:12px;margin:16px 0}
@media(max-width:700px){.layout{grid-template-columns:1fr}.side{order:2}.main{order:1;min-height:0}.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.tip{margin-top:10px}.app{padding:10px}}@media(max-width:390px){.stage-btn{padding:8px}.choice{min-height:56px}.pill{font-size:13px;padding:7px 9px}.brand p{font-size:13px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">🧠</div><div><h1>數學邏輯訓練站</h1><p>一步一步想，慢慢就會了！</p></div></div><div class="stats"><div class="pill">⭐ 得分：<span id="scoreTop">0</span></div><div class="pill">📝 題目：<span id="countTop">0 / 20</span></div></div></header>
<div class="progress"><div id="bar"></div></div><div class="layout"><aside class="side"><h2>🗺️ 練習地圖</h2><div class="stage" id="stages"></div><div class="tip"><b>💡 小提醒</b><br>不用急著回答。可以看圖、慢慢想，也可以讀注音提示。答錯時會先給你線索，再試一次。</div></aside>
<main class="main"><section id="start" class="center"><div style="font-size:70px">🔎🔢</div><h2>準備好當數字偵探了嗎？</h2><p>從 100 以後的數字開始，練習數字順序、位值、大小比較和找規律。每題都有提示，不需要一直讀長句子。</p><button class="primary" onclick="startGame()">開始挑戰！</button></section>
<section id="game" class="hidden"><div class="eyebrow"><span id="stageLabel"></span><span class="tag" id="skill"></span></div><div class="question" id="q"></div><p class="hintline" id="hintline"></p><div class="visual" id="visual"></div><div class="choices" id="choices"></div><div id="feedback" class="feedback"></div><div class="controls"><button class="secondary" id="hintBtn" onclick="showHint()">💡 給我提示</button><button class="primary" id="checkBtn" onclick="checkAnswer()" disabled>確認答案</button><button class="primary hidden" id="nextBtn" onclick="nextQuestion()">下一題 ➜</button></div></section>
<section id="result" class="hidden center"><div style="font-size:65px" id="medal">🏆</div><h2>挑戰完成！</h2><div>你答對了</div><div class="score" id="final">0 / 20</div><div id="message"></div><div class="resultgrid"><div class="resultcard"><b id="correct">0</b><span>答對題數</span></div><div class="resultcard"><b id="accuracy">0%</b><span>答對率</span></div><div class="resultcard"><b id="hints">0</b><span>使用提示</span></div></div><div class="review" id="review"></div><button class="primary" onclick="restartGame()">再練習一次</button></section>
</main></div><div class="foot">數學邏輯訓練站・繁體中文／注音提示</div></div>
<script>
const stages=[['🔢','數字接龍','100 之後怎麼數？'],['🧱','位值積木','百位、十位、個位'],['⚖️','比大小','比較數字大小'],['🧩','找規律','找出下一個數字']];
const bank=[
[0,'數字順序','100 的下一個數字是？','ㄧ ㄅㄞˇ 後面再多 1，就是下一個數字。','99 → 100 → ?',['101','110','200','99'],'101','從 100 開始再往後數一個：101。','100 後面是 101，再來是 102。'],
[0,'數字順序','請接著數：118、119、120、□','ㄧ ㄅㄞˇ ㄦˋ ㄕˊ 後面再加 1。','118　119　120　?',['121','130','119','201'],'121','每次只增加 1，120 後面是哪個數字？','120 後面是 121。'],
[0,'數字順序','哪一排數字是照順序排列？','從小到大，一個一個往上數。','從小到大 ↗',['128、129、130','128、130、129','130、128、129','129、128、130'],'128、129、130','比較三個數字：哪一個先、哪一個後？','128、129、130 每次增加 1。'],
[0,'數字順序','199 再多 1 是多少？','ㄧ ㄅㄞˇ ㄐㄧㄡˇ ㄕˊ ㄐㄧㄡˇ 再加 1，就會換到下一個整百數。','199 + 1 = ?',['200','190','201','100'],'200','99 再多 1 會變成 100；199 再多 1 呢？','199 再多 1 是 200。'],
[0,'數字順序','找出缺少的數字：196、197、□、199','每次增加 1。','196 → 197 → ? → 199',['198','188','200','197'],'198','197 後面數一個，再看看是不是接得上 199。','196、197、198、199。'],
[1,'位值觀念','數字 143 裡，有幾個「百」？','看最左邊的數字，它表示百位。','1 百　4 十　3 一',['1 個百','4 個百','3 個百','14 個百'],'1 個百','143 可以拆成 100、40 和 3。','143 有 1 個百、4 個十和 3 個一。'],
[1,'位值觀念','125 是由多少組成的？','把百位、十位、個位分開看。','100 + 20 + 5',['100＋20＋5','100＋2＋5','10＋20＋5','120＋50'],'100＋20＋5','百位是 1、十位是 2、個位是 5。','125 = 100 + 20 + 5。'],
[1,'位值觀念','哪個數字有 2 個百、0 個十、6 個一？','兩個百是 200，沒有十，還有 6 個一。','2 百　0 十　6 一',['206','260','26','602'],'206','把 200 和 6 合起來，中間沒有十位。','2 個百、0 個十、6 個一，就是 206。'],
[1,'位值觀念','150 裡有幾個十？','一個十是 10。數一數 150 裡有幾個 10。','150 = □ 個十',['15','5','150','10'],'15','100 裡有 10 個十，另外 50 裡有 5 個十。','150 裡有 15 個十。'],
[1,'位值觀念','哪個數字的十位是 7？','從右邊數第二個位置是十位。','看中間的數字',['172','127','217','271'],'172','十位是從右邊數第二位。','172 的個位是 2，十位是 7，百位是 1。'],
[2,'比較大小','145 和 154，哪一個比較大？','先比較百位；一樣時，再比較十位。','145　□　154',['145 比較大','154 比較大','一樣大','不能比較'],'154 比較大','兩個數的百位都是 1，再比較十位：4 和 5。','154 的十位是 5，比 145 的十位 4 大。'],
[2,'比較大小','哪個數字最小？','先看百位，再看十位和個位。','132　123　213',['132','123','213','都一樣'],'123','213 的百位是 2，比另外兩個大；比較 132 和 123。','123 最小，因為十位 2 比 3 小。'],
[2,'比較大小','哪個數字介於 120 和 130 之間？','比 120 大，但比 130 小。','120 ＜ □ ＜ 130',['119','125','130','135'],'125','找一個比 120 大、又比 130 小的數字。','125 在 120 和 130 中間。'],
[2,'比較大小','哪個數字最接近 200？','想一想，哪個數字離 200 的距離最短？','198　175　221',['198','175','221','都一樣'],'198','198 距離 200 只有 2；其他數字距離更遠。','198 和 200 只差 2。'],
[2,'比較大小','請選出正確的說法。','比較 206 和 260 的十位。','206　　260',['206 比 260 大','260 比 206 大','兩個一樣大','206 是 260 的兩倍'],'260 比 206 大','百位都為 2，再比較十位：0 和 6。','260 的十位是 6，206 的十位是 0，所以 260 比較大。'],
[3,'數字規律','找出下一個數字：110、120、130、□','每次增加 10。','110 → 120 → 130 → ?',['131','140','230','130'],'140','每次跳過 10，不是只加 1。','110、120、130、140，每次增加 10。'],
[3,'數字規律','找出下一個數字：105、110、115、□','看看每次增加多少。','105 → 110 → 115 → ?',['116','120','125','115'],'120','110 到 115 增加了 5，接著再加 5。','每次增加 5，所以答案是 120。'],
[3,'數字規律','哪個數字不符合規律？','這一排每次都增加 2。','102、104、107、108',['102','104','107','108'],'107','102 後面應是 104，再來應該加 2。','規律是每次加 2，104 後面應該是 106，不是 107。'],
[3,'生活邏輯','小明每次往前走 10 格：140、150、160、□。他會走到哪裡？','從 160 再往前 10。','140 → 150 → 160 → ?',['161','170','260','150'],'170','160 加上 10，十位往前一個十。','160 再加 10 是 170。'],
[3,'數字規律','找出缺少的數字：200、190、180、□','這次不是越來越大，而是每次少 10。','200 → 190 → 180 → ?',['170','179','190','160'],'170','180 再少 10。','每次減少 10，所以答案是 170。']
];
let qs=[],idx=0,score=0,selected=-1,locked=false,hintCount=0,wrong={};
function buildStages(){document.getElementById('stages').innerHTML=stages.map((s,i)=>'<button class="stage-btn" id="st'+i+'"><span class="emoji">'+s[0]+'</span><span>'+s[1]+'<small>'+s[2]+'</small></span></button>').join('')}
buildStages();
function startGame(){qs=[...bank].sort(()=>Math.random()-.5);idx=0;score=0;hintCount=0;wrong={};document.getElementById('start').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function render(){selected=-1;locked=false;let a=qs[idx];document.getElementById('stageLabel').textContent=stages[a[0]][1];document.getElementById('skill').textContent=a[1];document.getElementById('q').textContent=a[2];document.getElementById('hintline').textContent='注音／理解提示：'+a[3];document.getElementById('visual').innerHTML='<div class="big">'+a[4]+'</div>';document.getElementById('choices').innerHTML=a[5].map((o,i)=>'<button class="choice" onclick="pick('+i+')">'+o+'</button>').join('');let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';document.getElementById('checkBtn').classList.remove('hidden');document.getElementById('checkBtn').disabled=true;document.getElementById('hintBtn').classList.remove('hidden');document.getElementById('hintBtn').textContent='💡 給我提示';document.getElementById('nextBtn').classList.add('hidden');document.getElementById('scoreTop').textContent=score;document.getElementById('countTop').textContent=(idx+1)+' / '+qs.length;document.getElementById('bar').style.width=(idx/qs.length*100)+'%';stages.forEach((s,i)=>{let e=document.getElementById('st'+i);e.classList.toggle('active',i===a[0]);e.classList.toggle('done',qs.slice(0,idx).some(x=>x[0]===i))})}
function pick(i){if(locked)return;selected=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',j===i));document.getElementById('checkBtn').disabled=false}
function checkAnswer(){if(selected<0||locked)return;let a=qs[idx],bs=[...document.querySelectorAll('.choice')],f=document.getElementById('feedback');if(a[5][selected]===a[6]){score++;locked=true;bs[selected].classList.remove('selected');bs[selected].classList.add('correct');f.className='feedback show good';f.innerHTML='🎉 <b>答對了！</b><br>'+a[8];document.getElementById('checkBtn').classList.add('hidden');document.getElementById('hintBtn').classList.add('hidden');document.getElementById('nextBtn').classList.remove('hidden')}else{wrong[a[1]]=(wrong[a[1]]||0)+1;bs[selected].classList.remove('selected');bs[selected].classList.add('wrong');f.className='feedback show help';f.innerHTML='🧩 <b>再想一想！</b><br>'+a[7]+'<br><span style="font-size:14px">你可以再選一次，慢慢想，不用急。</span>';selected=-1;document.getElementById('checkBtn').disabled=true;document.getElementById('hintBtn').textContent='💡 再看一次提示'}document.getElementById('scoreTop').textContent=score}
function showHint(){let a=qs[idx],f=document.getElementById('feedback');hintCount++;f.className='feedback show help';f.innerHTML='💡 <b>小提示</b><br>'+a[7];document.getElementById('hintBtn').textContent='💡 提示已使用'}
function nextQuestion(){idx++;if(idx>=qs.length){showResults();return}render()}
function showResults(){document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('bar').style.width='100%';document.getElementById('countTop').textContent=qs.length+' / '+qs.length;document.getElementById('final').textContent=score+' / '+qs.length;document.getElementById('correct').textContent=score;document.getElementById('accuracy').textContent=Math.round(score/qs.length*100)+'%';document.getElementById('hints').textContent=hintCount;document.getElementById('medal').textContent=score>=16?'🏆':score>=11?'🌟':'🌱';document.getElementById('message').textContent=score>=16?'很棒！你已經掌握不少數字技巧。':score>=11?'做得不錯！再練習幾次會更熟悉。':'完成練習就是進步，下一次我們再一起挑戰！';let w=Object.entries(wrong).sort((a,b)=>b[1]-a[1]);document.getElementById('review').innerHTML=(w.length?'<b>📌 下次可以多練習：</b><br>'+w.map(x=>x[0]+'（答錯 '+x[1]+' 次）').join('、'):'<b>📌 這次沒有記錄到需要加強的題型。</b>')+'<br><span style="color:#718099;font-size:14px">錯誤紀錄可以幫助老師了解孩子需要加強的地方。</span>'}
function restartGame(){document.getElementById('result').classList.add('hidden');document.getElementById('start').classList.remove('hidden');document.getElementById('bar').style.width='0';document.getElementById('scoreTop').textContent='0';document.getElementById('countTop').textContent='0 / 20'}
</script></body></html>
